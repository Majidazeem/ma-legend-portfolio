name: Publish portfolio source
on:
  push:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract uploaded project archive
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "No project ZIP found in repository root."
            exit 1
          fi
          mkdir -p /tmp/ma-legend
          unzip -o "$ZIP" -d /tmp/ma-legend
          if [ -d /tmp/ma-legend/ma-legend-portfolio ]; then
            cp -a /tmp/ma-legend/ma-legend-portfolio/. .
          else
            cp -a /tmp/ma-legend/. .
          fi
          rm -f "$ZIP"
      - name: Commit extracted project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish MA LEGEND portfolio source"
            git push
          fi
